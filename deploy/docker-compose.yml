services:
  job-store-init:
    image: ${BIOCIRCUITS_EXPLORER_IMAGE:-biocircuits-explorer:local}
    user: "0:0"
    command:
      - sh
      - -eu
      - -c
      - |
        marker=/job-store/.biocircuits-owner-v1
        if [ ! -f "$$marker" ]; then
          chown -R rop:rop /job-store
          touch "$$marker"
          chown rop:rop "$$marker"
        fi
    restart: "no"
    volumes:
      - biocircuits-job-store:/job-store

  julia-app:
    image: ${BIOCIRCUITS_EXPLORER_IMAGE:-biocircuits-explorer:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BIOCIRCUITS_EXPLORER_VERSION: ${BIOCIRCUITS_EXPLORER_VERSION:-}
        BIOCIRCUITS_EXPLORER_REVISION: ${BIOCIRCUITS_EXPLORER_REVISION:-unknown}
        BIOCIRCUITS_EXPLORER_CREATED: ${BIOCIRCUITS_EXPLORER_CREATED:-unknown}
    container_name: biocircuits-explorer-julia
    restart: unless-stopped
    depends_on:
      job-store-init:
        condition: service_completed_successfully
    expose:
      - "8088"
    environment:
      - JULIA_NUM_THREADS=${JULIA_NUM_THREADS:-auto}
      - BIOCIRCUITS_EXPLORER_JOB_STORE=${BIOCIRCUITS_EXPLORER_JOB_STORE:-/home/rop/app/webapp/job_store}
    volumes:
      - biocircuits-job-store:/home/rop/app/webapp/job_store
    deploy:
      resources:
        limits:
          memory: ${BIOCIRCUITS_EXPLORER_MEMORY_LIMIT:-6G}
    healthcheck:
      # Compose uses service health to admit Nginx traffic, so this is the
      # readiness contract. The image-level HEALTHCHECK remains cheap liveness.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  nginx:
    image: nginx:alpine
    container_name: biocircuits-explorer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BIOCIRCUITS_EXPLORER_SERVER_NAME: "${BIOCIRCUITS_EXPLORER_SERVER_NAME:-biocircuits-explorer.com www.biocircuits-explorer.com}"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - "${BIOCIRCUITS_EXPLORER_SECRETS_DIR:-/opt/rop-explorer-secrets}/certs:/etc/nginx/ssl:ro"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-check-certificate -q -O /dev/null https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      julia-app:
        condition: service_healthy

volumes:
  biocircuits-job-store:
