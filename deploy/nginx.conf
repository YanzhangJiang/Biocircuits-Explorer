limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

upstream julia_app {
    server julia-app:8088;
}

server {
    listen 80;
    server_name ${BIOCIRCUITS_EXPLORER_SERVER_NAME};

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${BIOCIRCUITS_EXPLORER_SERVER_NAME};

    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    error_page 413 = @json_payload_too_large;

    location @json_payload_too_large {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        return 413 '{"error":"Request body exceeds the 1 MiB proxy limit","code":"request_body_too_large","limit_bytes":1048576,"retryable":false}';
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Clear-Site-Data "\"cache\"" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Static assets are deliberately served by julia-app from the same image as
    # the API. Mounting a host checkout here can pair a newly pulled backend
    # with an older/newer browser client and break wire compatibility.

    # Liveness/readiness probes. External monitors hit these frequently
    # (every few seconds for container orchestrators and ALB target groups),
    # so they bypass the api zone rate limit and have access_log silenced
    # to keep the access log readable. Short timeouts because these
    # handlers do no I/O — anything slower than ~1s means the backend is
    # already in trouble.
    location = /health {
        access_log off;
        proxy_pass http://julia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /ready {
        access_log off;
        proxy_pass http://julia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    # /metrics is the Prometheus scrape endpoint. Path labels are
    # low-cardinality, but the surface still hints at the API shape, so
    # restrict it to internal networks in production. The default below
    # only allows RFC1918 private space + loopback; remove the `deny all`
    # if you really do want public scraping, or replace the allow list
    # with your scraping subnet.
    location = /metrics {
        access_log off;
        allow 127.0.0.0/8;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://julia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
    }

    # API requests with rate limiting and extended timeout
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://julia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://julia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
