<!DOCTYPE html>
<html lang="en">
<head>
  <!-- One-off figure-export page for the out-of-repo screenshot pipeline; completion contract: window.__figureExport. -->
  <meta charset="utf-8">
  <title>Figure export: pulse design plot panels</title>
  <link rel="icon" href="data:,">
  <script src="vendor/plotly-2.27.0.min.js"></script>
  <link rel="stylesheet" href="./figure-export.css">
</head>
<body class="export-light">
  <div class="wrap">
    <div id="ropPlot" class="plot"></div>
    <div id="scanPlot" class="plot"></div>
    <div id="status">loading</div>
  </div>

  <script type="module">
    import { applyThemeMode } from './js/theme.js';
    import { plotROPPolyhedron, plotParameterScan1D } from './js/scan.js';
    import {
      apiSilent,
      chooseFamily,
      selectRepresentativePath,
      fixedQKFromTrajectory,
      styleExportRopPlot,
      styleExportScanPlot,
      reportFigureExportDone,
      reportFigureExportError,
    } from './js/figure-export.js';

    // Page-specific network (bell-shaped AB readout); distinct from the
    // shared TRIPLE_SWITCH_NETWORK used by the other export pages.
    const network = {
      species: [
        { name: 'A', role: 'free' },
        { name: 'B', role: 'free' },
        { name: 'C_A_B', role: 'bound' },
        { name: 'C_A_A_B', role: 'bound' },
      ],
      reactions: [
        { kind: 'binding', formula: 'A + B <-> C_A_B', reversible: true, kd: 1.0 },
        { kind: 'binding', formula: 'C_A_B + A <-> C_A_A_B', reversible: true, kd: 1.0 },
      ],
    };

    try {
      await applyThemeMode('light', { persist: false });
      const model = await apiSilent('build_model', { network });
      const session_id = model.session_id;
      const rop = await apiSilent('rop_polyhedron', {
        session_id,
        dimension: 2,
        pairs: [
          { x_symbol: 'A', qk_symbol: 'Kd1' },
          { x_symbol: 'B', qk_symbol: 'Kd1' },
        ],
        add_inner_points: true,
        npoints: 4000,
        singular_extends: 2,
      });
      const behavior = await apiSilent('behavior_families', {
        session_id,
        change_qK: 'tA',
        observe_x: 'C_A_B',
        path_scope: 'all',
        min_volume_mean: 0,
        deduplicate: true,
        keep_singular: true,
        keep_nonasymptotic: false,
        compute_volume: false,
      });
      const family = chooseFamily(behavior);
      const selectedPath = selectRepresentativePath(family);
      const trajectory = await apiSilent('siso_trajectory', {
        session_id,
        change_qK: 'tA',
        path_idx: selectedPath,
        start: -9,
        stop: 9,
        npoints: 700,
      });
      const scan = await apiSilent('parameter_scan_1d', {
        session_id,
        param_symbol: 'tA',
        param_min: -9,
        param_max: 9,
        n_points: 700,
        fixed_qK: fixedQKFromTrajectory(trajectory, behavior),
        output_exprs: ['C_A_B'],
      });

      plotROPPolyhedron(rop, 'ropPlot', { fitInnerPoints: false });
      plotParameterScan1D(scan, 'scanPlot');

      await styleExportRopPlot('ropPlot');
      await styleExportScanPlot({
        title: 'Forward equilibrium check: bell-shaped AB readout',
        xTitle: 'log10(total A)',
        yTitle: 'log10(AB concentration)',
        lineColor: '#2c7fb8',
        lineWidth: 3,
        traceName: 'AB readout',
      });

      reportFigureExportDone(
        { model, rop, behavior, family, selectedPath, trajectory, scan },
        `done: path #${selectedPath}, RO ${family.exact_label}`,
      );
    } catch (err) {
      reportFigureExportError(err);
    }
  </script>
</body>
</html>
