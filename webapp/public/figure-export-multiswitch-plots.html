<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figure export: multiswitch design plot panels</title>
  <script src="/vendor/plotly-2.27.0.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #1f2933;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap {
      width: 1520px;
      padding: 20px;
      display: grid;
      grid-template-columns: 720px 720px;
      gap: 24px;
    }
    .plot {
      width: 720px;
      height: 520px;
      border: 1px solid #ccd6e0;
      background: #ffffff;
    }
    #status {
      grid-column: 1 / -1;
      font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #52616f;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="ropPlot" class="plot"></div>
    <div id="scanPlot" class="plot"></div>
    <div id="status">loading</div>
  </div>

  <script type="module">
    import { applyThemeMode } from '/js/theme.js';
    import { plotROPPolyhedron, plotParameterScan1D } from '/js/scan.js';

    async function api(endpoint, body) {
      const resp = await fetch(`/api/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const json = await resp.json();
      if (!resp.ok || json.error) throw new Error(json.error || `${endpoint} failed`);
      return json;
    }

    const network = {
      species: [
        { name: 'A', role: 'free' },
        { name: 'B', role: 'free' },
        { name: 'C', role: 'free' },
        { name: 'C_A_B', role: 'bound' },
        { name: 'C_A_B_B', role: 'bound' },
        { name: 'C_A_C', role: 'bound' },
        { name: 'C_A_B_C', role: 'bound' },
      ],
      reactions: [
        { kind: 'binding', formula: 'C_A_B + B <-> C_A_B_B', reversible: true, kd: 1.0 },
        { kind: 'binding', formula: 'B + C_A_C <-> C_A_B_C', reversible: true, kd: 1.0 },
        { kind: 'binding', formula: 'A + B <-> C_A_B', reversible: true, kd: 1.0 },
        { kind: 'binding', formula: 'A + C <-> C_A_C', reversible: true, kd: 1.0 },
      ],
    };

    try {
      await applyThemeMode('light', { persist: false });
      const model = await api('build_model', { network });
      const session_id = model.session_id;
      const rop = await api('rop_polyhedron', {
        session_id,
        dimension: 2,
        pairs: [
          { x_symbol: 'A', qk_symbol: 'Kd1' },
          { x_symbol: 'B', qk_symbol: 'Kd1' },
        ],
        add_inner_points: true,
        npoints: 5000,
        singular_extends: 2,
      });
      const siso = await api('siso_paths', {
        session_id,
        change_qK: 'tA',
      });
      const selectedPath = 142;
      const trajectory = await api('siso_trajectory', {
        session_id,
        change_qK: 'tA',
        path_idx: selectedPath,
        start: -6,
        stop: 6,
        npoints: 420,
      });
      const fixedQK = [...trajectory.parameters];
      fixedQK.splice(siso.change_qK_idx - 1, 0, 0);
      const scan = await api('parameter_scan_1d', {
        session_id,
        param_symbol: 'tA',
        param_min: -8,
        param_max: 8,
        n_points: 650,
        fixed_qK: fixedQK,
        output_exprs: ['C_A_B_B'],
      });

      plotROPPolyhedron(rop, 'ropPlot', { fitInnerPoints: false });
      plotParameterScan1D(scan, 'scanPlot');

      await Plotly.relayout('ropPlot', {
        'title.text': 'Reaction-order geometry',
        'title.font.size': 15,
        'xaxis.title.text': 'reaction order of A',
        'yaxis.title.text': 'reaction order of B',
        'font.family': 'Arial, Helvetica, sans-serif',
      });
      await Plotly.restyle('scanPlot', {
        'line.color': ['#1d4e89'],
        'line.width': [3.2],
        name: ['A-B-B complex'],
      });
      await Plotly.relayout('scanPlot', {
        'title.text': 'Forward equilibrium check: triple-switch readout',
        'title.font.size': 15,
        'xaxis.title.text': 'log10(total A)',
        'yaxis.title.text': 'log10(A-B-B concentration)',
        'font.family': 'Arial, Helvetica, sans-serif',
        'showlegend': false,
      });

      window.__figureExport = {
        model,
        rop,
        siso,
        selectedPath,
        trajectory,
        scan,
        done: true,
      };
      document.getElementById('status').textContent = 'done: path #142; compressed motif + - + -';
    } catch (err) {
      console.error(err);
      window.__figureExport = { done: false, error: String(err && err.message || err) };
      document.getElementById('status').textContent = `error: ${String(err && err.message || err)}`;
    }
  </script>
</body>
</html>
