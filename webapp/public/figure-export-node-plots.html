<!DOCTYPE html>
<html lang="en">
<head>
  <!-- One-off figure-export page for the out-of-repo screenshot pipeline; completion contract: window.__figureExport. -->
  <meta charset="utf-8">
  <title>Biocircuits Explorer figure export</title>
  <link rel="icon" href="data:,">
  <script src="vendor/plotly-2.27.0.min.js"></script>
  <link rel="stylesheet" href="./style-node.css">
  <link rel="stylesheet" href="./figure-export.css">
</head>
<body class="export-dark">
  <div class="wrap">
    <div class="export-node-card" id="ropNode">
      <div class="export-node-head">ROP Polyhedron Result</div>
      <div class="export-node-body">
        <div class="export-chips">
          <span class="export-chip">2D</span>
          <span class="export-chip">A1: A / Kd1</span>
          <span class="export-chip">A2: B / Kd1</span>
          <span class="export-chip">Minimal multimodal witness</span>
        </div>
        <div class="plot-container" id="ropPlot"></div>
      </div>
    </div>
    <div class="export-node-card" id="scanNode">
      <div class="export-node-head">Parameter Scan Result</div>
      <div class="export-node-body">
        <div class="export-chips">
          <span class="export-chip">Scan: tA</span>
          <span class="export-chip">Output: C_A_B_B</span>
          <span class="export-chip">path interior parameters</span>
        </div>
        <div class="plot-container" id="scanPlot"></div>
      </div>
    </div>
    <div class="export-node-card" id="trajectoryNode">
      <div class="export-node-head">SISO Trajectory Result</div>
      <div class="export-node-body">
        <div class="export-chips">
          <span class="export-chip" id="pathChip">Path: selecting...</span>
          <span class="export-chip">Input: tA</span>
          <span class="export-chip">Readout: C_A_B_B</span>
        </div>
        <div class="plot-container" id="trajectoryPlot"></div>
      </div>
    </div>
    <div id="status">loading</div>
  </div>
  <script type="module">
    import { applyThemeMode } from './js/theme.js';
    import { plotROPPolyhedron, plotParameterScan1D } from './js/scan.js';
    import { plotTrajectory } from './js/plotting.js';
    import {
      apiSilent,
      TRIPLE_SWITCH_NETWORK,
      chooseExactFamily,
      selectRepresentativePath,
      fixedQKFromTrajectory,
      reportFigureExportDone,
      reportFigureExportError,
    } from './js/figure-export.js';

    try {
      await applyThemeMode('dark', { persist: false });
      const model = await apiSilent('build_model', { network: TRIPLE_SWITCH_NETWORK });
      const session_id = model.session_id;
      const rop = await apiSilent('rop_polyhedron', {
        session_id,
        dimension: 2,
        pairs: [
          { x_symbol: 'A', qk_symbol: 'Kd1' },
          { x_symbol: 'B', qk_symbol: 'Kd1' },
        ],
        add_inner_points: true,
        npoints: 5000,
        singular_extends: 2,
      });
      const behavior = await apiSilent('behavior_families', {
        session_id,
        change_qK: 'tA',
        observe_x: 'C_A_B_B',
        path_scope: 'all',
        min_volume_mean: 0,
        deduplicate: true,
        keep_singular: true,
        keep_nonasymptotic: false,
        compute_volume: false,
      });
      const family = chooseExactFamily(behavior);
      const selectedPath = selectRepresentativePath(family);
      document.getElementById('pathChip').textContent =
        `Path: #${selectedPath}; RO ${family.exact_label}`;
      const trajectory = await apiSilent('siso_trajectory', {
        session_id,
        change_qK: 'tA',
        path_idx: selectedPath,
        start: -8,
        stop: 8,
        npoints: 600,
      });
      const scan = await apiSilent('parameter_scan_1d', {
        session_id,
        param_symbol: 'tA',
        param_min: -8,
        param_max: 8,
        n_points: 500,
        fixed_qK: fixedQKFromTrajectory(trajectory, behavior),
        output_exprs: ['C_A_B_B'],
      });

      plotROPPolyhedron(rop, 'ropPlot', { fitInnerPoints: false });
      plotParameterScan1D(scan, 'scanPlot');
      plotTrajectory(trajectory, 'trajectoryPlot');
      reportFigureExportDone({ model, rop, behavior, family, selectedPath, scan, trajectory });
    } catch (err) {
      reportFigureExportError(err);
    }
  </script>
</body>
</html>
