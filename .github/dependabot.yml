version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/webapp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Group dev tooling churn into a single PR to reduce noise.
    groups:
      js-dev-deps:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "esbuild"
          - "globals"

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
