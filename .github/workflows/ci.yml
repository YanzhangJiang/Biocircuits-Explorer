name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-js:
    name: Lint JS / i18n sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "webapp/package-lock.json"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install repository verification dependencies
        run: python3 -m pip install --requirement scripts/requirements-verify.txt

      - name: Install JS dev dependencies
        working-directory: webapp
        run: npm ci

      - name: ESLint (errors and warnings fail)
        working-directory: webapp
        run: npm run lint

      - name: Frontend unit tests (command model / undo)
        working-directory: webapp
        run: npm run test:js

      - name: Python Agent contract tests
        working-directory: webapp
        run: npm run test:py

      - name: Periodic-table Python contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: index.html / index.zh.html structural sync
        working-directory: webapp
        run: npm run check-i18n-sync

  browser-e2e:
    name: Browser E2E / accessibility / visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "webapp/package-lock.json"

      - name: Install browser test dependencies
        working-directory: webapp
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: webapp
        run: npx playwright install --with-deps chromium

      - name: Run real-browser workspace quality gate
        working-directory: webapp
        run: npm run test:e2e

      - name: Upload Playwright diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            webapp/e2e/.artifacts/playwright-report
            webapp/e2e/.artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-macos-host:
    name: macOS host on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Cover both the oldest readily available Intel lane and the current
        # Apple-silicon macOS release used by the native shell.
        os: [macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS host tests without signing
        run: >-
          xcodebuild
          -project frontend-swift/BiocircuitsExplorerMac.xcodeproj
          -scheme BiocircuitsExplorerMac
          -destination 'platform=macOS'
          -derivedDataPath build/xcode-ci
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Run macOS host unit tests
        run: >-
          xcodebuild
          -project frontend-swift/BiocircuitsExplorerMac.xcodeproj
          -scheme BiocircuitsExplorerMac
          -destination 'platform=macOS'
          -derivedDataPath build/xcode-ci
          CODE_SIGNING_ALLOWED=NO
          -only-testing:BiocircuitsExplorerMacTests
          test-without-building

  test-julia:
    name: Julia ${{ matrix.julia }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both Project.toml files declare exactly the 1.10 and 1.12 minor
        # lines; run the full owner suite on both so the declaration, the
        # per-version manifests, and the verified matrix stay aligned.
        julia: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install repository verification dependencies
        run: python3 -m pip install --requirement scripts/requirements-verify.txt

      - name: Install system dependencies (libcdd for CDDLib)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcdd-dev

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
          arch: x64

      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-${{ matrix.julia }}-webapp

      - name: Instantiate webapp project (with local Bnc_julia)
        env:
          JULIA_NUM_THREADS: auto
        run: |
          julia --project=webapp --color=yes -e '
            using Pkg
            expected = if VERSION < v"1.11"
                joinpath(dirname(Base.active_project()), "Manifest-v1.10.toml")
            else
                joinpath(dirname(Base.active_project()), "Manifest.toml")
            end
            ctx = Pkg.Types.Context()
            selected = ctx.env.manifest_file
            normpath(selected) == normpath(expected) ||
                error("selected $(selected), expected $(expected)")
            Pkg.Operations.is_manifest_current(ctx.env) === true ||
                error("selected manifest is stale for $(Base.active_project())")
            Pkg.develop(path="Bnc_julia")
            Pkg.instantiate()
          '

      - name: Run webapp test suite
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=webapp --color=yes webapp/test/runtests.jl

      - name: Live Design Agent → Design Screen → Placer contract
        env:
          JULIA_NUM_THREADS: auto
        working-directory: webapp/scripts
        run: python3 -m unittest test_design_agent_live_engine.py -v

      - name: Math-core golden-value regression suite (BindingAndCatalysis)
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=webapp --color=yes Bnc_julia/test/runtests.jl

      - name: Latent Atlas phenotyper tests
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=webapp --color=yes webapp/test/test_phenotype_pipeline.jl

      - name: Packaged VERSION resource discovery contract
        run: julia --color=yes tests/version_resource_contract.jl

      - name: Instantiate packaging project
        run: julia --project=packaging --color=yes -e 'using Pkg; Pkg.instantiate()'

      - name: Packaged Design Agent runtime contract
        run: julia --project=packaging --color=yes packaging/test_design_runtime.jl

      - name: Repository contracts, generated references, and artifacts
        env:
          JULIA_NUM_THREADS: auto
        run: python3 scripts/verify_repository.py --check

      - name: Function-Space Reader no-fabrication + usage-boundary regression
        run: |
          python3 -m pip install --quiet numpy || python3 -m pip install --quiet --break-system-packages numpy
          python3 webapp/scripts/reader/test_reader_nofabrication.py

  test-hpc-environment:
    name: HPC environment on Julia ${{ matrix.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (libcdd for CDDLib)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcdd-dev

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
          arch: x64

      - uses: julia-actions/cache@v2
        with:
          cache-name: julia-${{ matrix.julia }}-hpc

      - name: Select the matching lock and load the headless engine
        env:
          JULIA_NUM_THREADS: auto
        run: |
          julia --project=webapp_hpc --color=yes -e '
            using Pkg
            expected = if VERSION < v"1.11"
                joinpath(dirname(Base.active_project()), "Manifest-v1.10.toml")
            else
                joinpath(dirname(Base.active_project()), "Manifest.toml")
            end
            ctx = Pkg.Types.Context()
            selected = ctx.env.manifest_file
            normpath(selected) == normpath(expected) ||
                error("selected $(selected), expected $(expected)")
            Pkg.Operations.is_manifest_current(ctx.env) === true ||
                error("selected manifest is stale for $(Base.active_project())")
            Pkg.instantiate()
            using BindingAndCatalysis
          '

      - name: Headless golden computation smoke
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=webapp_hpc --color=yes Bnc_julia/test/headless_golden_smoke.jl
