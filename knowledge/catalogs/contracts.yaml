  - id: "job-lifecycle"
    version: "current-at-f9c65a5"
    kind: "state-machine"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/api.md"
    sources:
      - "webapp/src/config.jl"
      - "webapp/src/jobs.jl"
      - "webapp/src/cancellation.jl"
    tests:
