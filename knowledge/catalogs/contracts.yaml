    tests:
      - "webapp/test/designability_spec_contract.jl"
      - "webapp/test/design_screen_contract.jl"
      - "webapp/test/design-target-render.test.mjs"
    compatibility: "Design Screen v0.3 adds eligible_count, evaluated_count, and truncated so callers can distinguish complete from budget-limited evaluation. The UI retains a v0.2 count fallback; recommended remains a compatibility alias for verified_recommendations, never screened_candidates."
    coverage: "direct"

  - id: "rop-shape-optimization"
    version_source: "schema-const"
    schemas:
      - "schemas/rop-shape-optimize-request.schema.json"
      - "schemas/rop-shape-optimization.schema.json"
    kind: "schema-and-evidence"
    owner: "rop-shape-optimization"
    docs:
      - "knowledge/contracts/schemas.md"
      - "knowledge/contracts/scientific-evidence.md"
      - "knowledge/modules/rop-shape-optimization.md"
      - "knowledge/decisions/0002-rop-shape-margin-and-evidence.md"
    sources:
      - "schemas/rop-shape-optimize-request.schema.json"
      - "schemas/rop-shape-optimization.schema.json"
      - "webapp/src/rop_shape_api.jl"
      - "webapp/src/rop_shape_optimization.jl"
      - "webapp/src/rop_shape_replay.jl"
      - "webapp/src/designability_feasible_regions.jl"
    tests:
      - "webapp/test/rop_shape_schema_contract.jl"
      - "webapp/test/rop_shape_api_contract.jl"
      - "webapp/test/rop_shape_optimization_contract.jl"
      - "webapp/test/rop_shape_replay_contract.jl"
      - "webapp/test/rop_shape_cat_benchmark.jl"
    compatibility: "The v1 request is a fixed-topology, reference-relative, finite-budget contract. Julia is the sole NetworkIR canonicalizer; legacy inputs may set the expected canonical hash to null, while every normalized response carries the complete NetworkIR and matched hash. Exact cell geometry, parameter-only margin, bounded coverage, and sampled replay remain separate evidence layers."
    coverage: "schema-instance-and-core-contracts"

  - id: "behavior-spec"
    version_source: "schema-const"
    schemas:
      - "schemas/behavior-spec.schema.json"
    kind: "schema"
    owner: "designability"
    docs:
      - "knowledge/contracts/schemas.md"
    sources:
      - "schemas/behavior-spec.schema.json"
      - "webapp/src/latent_atlas/evaluators.jl"
