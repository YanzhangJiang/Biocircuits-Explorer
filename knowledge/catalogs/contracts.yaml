      - "webapp/test/design-spec-node-contract.test.mjs"
    compatibility: "Normalizer requires the exact current version."
    coverage: "direct"

  - id: "designability-screen"
    version_source: "schema-const"
    schemas:
      - "schemas/designability-screen.schema.json"
    kind: "schema-and-evidence"
    owner: "designability"
    docs:
