schema_version: "bcx-contract-catalog/v1.0.0"
baseline_evidence_revision: "f9c65a5"
current_verified_revision: "1177a3d"
verification_command: "python3 scripts/verify_repository.py --check"
path_base: "repository-root"
path_policy: "posix-relative"
contracts:
  - id: "http-api-v1"
    version_source: "api-contract"
    kind: "wire"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/api.md"
    sources:
      - "webapp/src/api_contract.jl"
      - "webapp/src/routing.jl"
      - "webapp/src/jobs.jl"
      - "webapp/src/serialization.jl"
      - "webapp/src/request_support.jl"
      - "webapp/src/sync_work_budget.jl"
      - "webapp/src/path_work_budget.jl"
      - "webapp/src/atlas_build_budget.jl"
      - "webapp/src/atlas_corpus_budget.jl"
      - "webapp/src/atlas_query_budget.jl"
      - "webapp/scripts/export_reference_facts.jl"
    tests:
      - "webapp/test/api_contract.jl"
      - "webapp/test/runtests.jl"
      - "webapp/test/concurrency_and_budget_contract.jl"
      - "webapp/test/input_validation_contract.jl"
      - "tests/test_deployment_contract.py"
    compatibility: "The canonical versioned surface and legacy sunset come from executable route metadata; bare /api routes remain deprecated aliases until that sunset. Oversized JSON bodies, exhausted synchronous capacity, and over-budget synchronous work fail with bounded machine-readable 413, 429, and 422 responses respectively."
    coverage: "direct"

  - id: "numerical-validity"
    version: "current-at-1177a3d"
    kind: "runtime-result-semantics"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/api.md"
      - "knowledge/contracts/scientific-evidence.md"
    sources:
      - "webapp/src/model_runtime.jl"
      - "webapp/src/analysis_computation.jl"
      - "webapp/src/parameter_scan_handlers.jl"
      - "webapp/public/js/plot-validity.js"
      - "webapp/public/js/scan.js"
      - "webapp/public/js/rop-cloud.js"
    tests:
      - "webapp/test/numerical_validity_contract.jl"
      - "webapp/test/scan-validity-contract.test.mjs"
    compatibility: "Failed or non-finite numerical samples remain explicit through validity and partial-result fields and render as gaps; they must not be silently coerced to valid zero-valued observations."
    coverage: "direct-backend-and-rendering"

  - id: "application-release-identity"
    version_source: "VERSION"
    kind: "release-identity"
    owner: "deployment"
    docs:
      - "knowledge/modules/deployment.md"
      - "knowledge/modules/macos-host.md"
    sources:
      - "VERSION"
      - "scripts/set_version.sh"
      - "webapp/src/version.jl"
      - "deploy/build_image.sh"
      - "packaging/build_backend_app.jl"
      - "packaging/macos_release_metadata.sh"
      - "scripts/build_macos_dmg.sh"
    tests:
      - ".github/workflows/docker.yml"
      - "tests/test_build_image.py"
      - "tests/test_macos_release_metadata.py"
      - "tests/test_set_version.py"
      - "tests/test_verify_repository.py"
      - "tests/version_resource_contract.jl"
    compatibility: "VERSION owns the full application SemVer synchronized into project, manifest, and npm metadata and exposed from packaged resources; Docker tags project '+' to '_', while Apple marketing versions use only the three-part numeric core and artifact names retain the full SemVer."
    coverage: "synchronization-packaged-resource-and-configured-container-smoke"

  - id: "network-ir"
    version_source: "schema-const"
    schemas:
      - "schemas/network-ir.schema.json"
    kind: "schema"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/schemas.md"
    sources:
      - "webapp/src/ir.jl"
      - "schemas/network-ir.schema.json"
      - "webapp/scripts/gen_schemas.jl"
    tests:
      - "webapp/test/runtests.jl"
      - "webapp/test/input_validation_contract.jl"
    compatibility: "Generated schema; parser accepts the bne-ir family and selected legacy reaction payloads."
    coverage: "generated-drift-and-runtime"

  - id: "design-spec"
    version_source: "schema-const"
    schemas:
      - "schemas/design-spec.schema.json"
    kind: "schema"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/schemas.md"
    sources:
      - "webapp/src/ir.jl"
      - "schemas/design-spec.schema.json"
      - "webapp/scripts/gen_schemas.jl"
    tests:
      - "webapp/test/runtests.jl"
    compatibility: "Generated schema with typed known constraints and an extension escape hatch."
    coverage: "generated-drift-and-runtime"

  - id: "result-artifact"
    version_source: "schema-const"
    schemas:
      - "schemas/result-artifact.schema.json"
    kind: "schema-and-provenance"
    owner: "backend-runtime"
    docs:
      - "knowledge/contracts/schemas.md"
      - "knowledge/contracts/scientific-evidence.md"
    sources:
      - "webapp/src/result_artifact.jl"
      - "schemas/result-artifact.schema.json"
    tests:
      - "webapp/test/runtests.jl"
    compatibility: "Envelope can be attached as a sibling to legacy flat responses."
    coverage: "runtime-shape-and-version"

  - id: "job-result-manifest"
    version_source: "schema-const"
    schemas:
      - "schemas/job-result-manifest.schema.json"
    kind: "schema-and-publication-protocol"
    owner: "batch-hpc"
    docs:
      - "knowledge/contracts/schemas.md"
      - "knowledge/modules/batch-hpc.md"
    sources:
      - "webapp/src/jobs.jl"
      - "webapp/scripts/run_batch_job.jl"
      - "schemas/job-result-manifest.schema.json"
    tests:
      - "webapp/test/jobs_artifact_validity_contract.jl"
      - "webapp/test/runtests.jl"
    compatibility: "New AWS records require the v1 manifest commit marker; only records without a result-protocol field use the legacy inline result verifier. A broker reading a persisted unknown future protocol keeps verification retryable, while a worker asked to execute an unsupported protocol fails the worker job. Rolling deployments must update the worker image/job definition before the submitting broker."
    coverage: "strict-runtime-validator-mocked-object-store-and-schema-version"

  - id: "designability-spec"
    version_source: "schema-const"
    schemas:
