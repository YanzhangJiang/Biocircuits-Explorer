      - "webapp/test/ro-field-render.test.mjs"
    compatibility: "RO Field v1 is additive and discriminates sampled_grid, exact_cell_complex, and directional_path. Its request envelope selects exactly one of inline NetworkIR, canonical NetworkIR hash, or in-memory session id, and keeps non-inline storage capability separate from schema validity. It freezes rather than reinterprets SISO RPB1 identity; existing ChangePaths are path bundles, not cell complexes. Sparse-v2 adaptive plans, batches, ordered point-result chunks, states, checkpoints, terminal results, and manifests form a separate nested-CAS family and do not reuse the v1 Cartesian chunk schemas or byte identities. P5--P9 evidence artifacts have separate identities and do not widen the v1 interchange meaning. A D=3 exact-dyadic regular-extension certificate is authoritative only after validation against its bound source complex, a model-backed trajectory is authoritative only for its declared finite protocol and solver policy, and no local self-hash alone upgrades either into a scientific certificate. Partial, invalid, singular, set-valued, omitted, truncated, incomplete-storage, or unreplayed results cannot claim complete declared-population evidence."
    coverage: "bounded-engine-api-sqlite-signature-demo-atlas-local-cartesian-and-sparse-v2-nested-cas-jobs-slices-d3-exact-dyadic-regular-extension-finite-protocol-model-trajectories-and-campaign-preparation-no-full-campaign"

