      - "webapp/test/jobs_cancellation_contract.jl"
      - "webapp/test/cooperative_cancel_checkpoints_contract.jl"
      - "webapp/test/concurrency_and_budget_contract.jl"
    compatibility: "Terminal state is monotonic; local cancellation is cooperative; remote calls execute outside the shared job lock; a persisted claim serializes concurrent AWS cancel dispatch and is released for retry after failure. AWS queue, definition, artifact, name, environment, CPU, and memory values supplied by a request override trusted runtime configuration only when BIOCIRCUITS_EXPLORER_ALLOW_AWS_BATCH_REQUEST_CONFIG is explicitly enabled."
    coverage: "direct-race-contracts"

