    purpose: "Build and operate the containerized backend/static app, optional proxy, version metadata, cloud bootstrap helpers, and the external release-candidate evidence procedure."
    doc: "knowledge/modules/deployment.md"
    owner_paths:
      - "deploy"
      - "packaging"
      - "VERSION"
      - "scripts/set_version.sh"
      - "schemas/release-candidate-evidence.schema.json"
      - "operations/evidence/release-candidate.template.json"
      - "knowledge/runbooks/release-candidate-external-verification.md"
    entrypoints:
      - "deploy/Dockerfile"
      - "deploy/docker-compose.yml"
      - "deploy/build_image.sh"
      - "deploy/deploy.sh"
      - "deploy/setup_aws_batch.sh"
      - "packaging/build_backend_app.jl"
      - "scripts/build_macos_dmg.sh"
    tests:
      - ".github/workflows/docker.yml"
      - "packaging/test_design_runtime.jl"
      - "tests/test_build_image.py"
      - "tests/test_deployment_contract.py"
      - "tests/test_macos_release_metadata.py"
      - "tests/test_release_candidate_evidence.py"
      - "tests/test_rewrite_rollback_config.py"
      - "tests/test_set_version.py"
      - "tests/test_setup_aws_batch.py"
      - "tests/test_validate_aws_batch_state.py"
      - "tests/version_resource_contract.jl"
    depends_on:
      - "backend-runtime"
      - "web-workspace"
    provides:
      - "container-image-definition"
      - "backend-app-bundle"
      - "deployment-configuration"
      - "application-release-identity"
      - "immutable-image-reference-policy"
      - "release-candidate-evidence-pack"
    maturity: "active"
    evidence_boundary: "The Docker workflow is configured to build one image and probe readiness, liveness, version, static assets, and job-store writes. The release-candidate schema/template/runbook is prepared but unexecuted; local contracts do not prove registry/SBOM/signing, full Compose/TLS, live AWS/Slurm, or macOS signing/notarization."

  - id: "batch-hpc"
    name: "Batch and HPC execution"
    purpose: "Manage local/AWS asynchronous job lifecycle and run large atlas or phenotype workloads through Slurm or the headless backend project."
    doc: "knowledge/modules/batch-hpc.md"
    owner_paths:
      - "webapp/src/jobs.jl"
      - "webapp/src/cancellation.jl"
      - "webapp/scripts/run_batch_job.jl"
      - "schemas/result-artifact.schema.json"
      - "schemas/job-result-manifest.schema.json"
      - "webapp_hpc"
      - "Bnc_julia_headless"
      - "slurm"
    entrypoints:
      - "webapp/scripts/run_batch_job.jl"
      - "slurm/atlas_build.sbatch"
      - "slurm/env_setup.sh"
    tests:
      - ".github/workflows/ci.yml"
      - "webapp/test/runtests.jl"
      - "webapp/test/jobs_cancellation_contract.jl"
      - "webapp/test/jobs_cache_concurrency_contract.jl"
      - "webapp/test/jobs_artifact_validity_contract.jl"
      - "webapp/test/jobs_submission_reconciliation_contract.jl"
      - "webapp/test/cooperative_cancel_checkpoints_contract.jl"
    depends_on:
      - "engine-rop"
      - "atlas"
    provides:
      - "headless-backend"
      - "local-and-aws-job-lifecycle"
      - "asynchronous-result-commit-manifest"
      - "slurm-workflows"
      - "version-matched-hpc-environments"
    maturity: "mixed"
    evidence_boundary: "Local job races, cooperative cancellation, and request-level AWS overrides are contract-tested; the workflow is configured to select Julia 1.10 and 1.12 HPC locks, which were also loaded locally on 1.10.11 and 1.12.6. No external workflow run, live AWS/Slurm run, exact cluster patch version, or campaign result merge is verified."

  - id: "periodic-table-research"
    name: "Periodic-table research layer"
    purpose: "Define a bounded binding grammar, search for witnesses, encode results/certificates, and export research snapshots."
    doc: "knowledge/modules/periodic-table-research.md"
    owner_paths:
      - "src/periodic_table"
      - "scripts/periodic_table"
    entrypoints:
      - "scripts/periodic_table/run_periodic_search.py"
      - "src/periodic_table/complete_definition.py"
    tests:
      - "tests/test_periodic_table.py"
    depends_on:
      - "engine-rop"
      - "atlas"
    provides:
      - "periodic-table-search"
      - "witness-and-certificate-records"
      - "periodic-search-artifacts"
    maturity: "research"
    evidence_boundary: "Bounded search supports witnesses but not general absence; paper-side material is not tracked or verified here."
