    maturity: "core"
    evidence_boundary: "Numerical output is scoped to the supplied model, solver policy, declared population, and assumptions; it is not a biological experiment. The quadratic nonlinear input chart performs pointwise numerical immersion/conditioning admission and the complete local first/second-order chain rule. First-order arrays must declare the exact source axis, units, and evaluated point, but caller labels are not independently authenticated; scalar second-order receipts additionally bind chart declaration and output identity. The chart does not certify global injectivity, chart overlaps, or calibration uncertainty. The observable chart admits only finite declarative affine/quadratic maps; unit strings are identity labels without dimensional algebra or conversion, and general ratio/log-sum maps are absent. P5r0.1 exact-dyadic polynomial certificates prove one root per control and uniqueness only inside a declared positive tube; branch identity transfers only through a replayed full-dimensional bridge containing both complete patch tubes. Complete affine-tube substitution preserves repeated state/control correlations before differentiation, but ordinary interval wrapping can still reject a valid tube. They do not exclude outside roots, enumerate global branches, enclose folds/Hopf events, or cover native log/transcendental residuals; that P5r1 path remains design-only and requires a direct pinned interval dependency. P8s0 replays only the supplied P5r0.1 population, treats passed bridges as evidence-relative components, encloses conservative patch stability and ordered state log responses, and proves only an at-least-N stable-root witness on a declared common box. It does not certify population completeness, bifurcation boundaries, global continuation, or hysteresis. P8s1a separately proves a complete regular-root population and an empty fold set only inside one replayed exact-dyadic tensor cover of a declared affine moving state domain. It requires full-control-box patches in one common slope coordinate and rejects any unresolved cell; roots outside that domain, stability completeness, fold-containing domains, Hopf events, native residuals, and global continuation remain unknown. P8s1b0 separately exhausts H=(F,det(F_x)) for exactly one control and proves a complete isolated simple-fold set only inside one declared positive augmented domain. P8s1b1 attaches each selected event only to two local regular half-branches in one declarative chart, with replayed full-half bridges, strict original-patch tube containment, and a complete-census corridor excluding intervening folds. It does not prove original-control two-root-side orientation, stability, remote component identity, a global branch graph, multi-control fold sheets, native residuals, or hysteresis. P8s1c0 binds exactly one-control polynomial vector-field semantics and exhausts the phase-free H=(F,E(omega^2),O(omega^2)) system from zero frequency to beyond an exact uniform spectral bound. P8s1c1 then replays that complete parent, validates full bordered right/adjoint eigensystems, A and second-harmonic resolvents, raw second/third state derivatives, and a unit-q Kuznetsov first-Lyapunov interval separated from zero for every parent event. P8s1c2a replays the complete c0/c1 chain and lifts every event to a theorem-level local periodic-orbit germ, original-control side, and center-manifold radial attraction or repulsion for sufficiently small nonzero but unquantified amplitude. A local child event hash cannot replace parent replay. P8s1c2a constructs no explicit orbit enclosure or validated branch, quantitative amplitude radius, Floquet spectrum, full-state periodic-orbit stability, periodic-orbit population completeness, multi-control event sheet, native-residual result, global continuation, or hysteresis proof; P8s1c2b/P8s1c2c remain design-only. The explicit-affine D=3 builder constructs Float64 incidence and applies dyadic-exact publication predicates to the admitted Float64 domain/halfspaces; it is not an arbitrary-real or D>=4 exact-incidence API. The D3 global regular-extension result is exact only for admitted Float64 bits interpreted as dyadic rationals on a complete contractible box and only for regular-cell extensions; authority requires validation against the bound source complex and exact replay, not the certificate self-hash alone, and it does not cover holed domains, singular branches, or chemistry extraction. Uncertainty calibration is synthetic/declared finite-population evidence, and externally supplied interval feature-bound certificates are bound but not reproved. The equilibrium branch-loop analyzer remains conditional. Model-backed trajectory evidence integrates a finite deterministic polynomial protocol and binds the vector field, protocol, solver policy, and lineage, but it does not provide a validated error enclosure or certify branch switching, hysteresis, global reachability, basin completeness, experimental causality, or global dynamics; its hashes are provenance identities rather than standalone scientific certificates."

