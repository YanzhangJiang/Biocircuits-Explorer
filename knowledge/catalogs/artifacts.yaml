schema_version: "bcx-artifact-catalog/v1.0.0"
baseline_evidence_revision: "f9c65a5"
verification_command: "python3 scripts/verify_repository.py --check"
path_base: "repository-root"
path_policy: "posix-relative"
unknown_token: "unknown"
artifacts:
  - id: "generated-contract-reference"
    kind: "generated-reference"
    paths:
      - "knowledge/generated/reference.md"
    producer: "scripts/verify_repository.py --write"
    validator: "scripts/verify_repository.py --check"
    authority: "Executable API metadata, JSON Schemas, contract catalogs, version files, and CI configuration"
    status: "deterministic-drift-gated"

  - id: "ir-json-schemas"
    kind: "generated-contract"
    paths:
      - "schemas/network-ir.schema.json"
      - "schemas/design-spec.schema.json"
    producer: "webapp/scripts/gen_schemas.jl"
    validator: "scripts/verify_repository.py --check"
    authority: "Runtime structs and parser in webapp/src/ir.jl"
    status: "verified-drift-gated"

  - id: "hand-authored-json-schemas"
    kind: "contract"
    paths:
      - "schemas/behavior-spec.schema.json"
      - "schemas/design-agent-trace.schema.json"
      - "schemas/designability-screen.schema.json"
      - "schemas/designability-spec.schema.json"
      - "schemas/latent-atlas-manifest.schema.json"
      - "schemas/reader-query.schema.json"
      - "schemas/reader-result.schema.json"
      - "schemas/result-artifact.schema.json"
      - "schemas/target-spec.schema.json"
    producer: "manual-with-runtime-owner"
    validator: "scripts/verify_repository.py --check"
    authority: "Each schema plus the runtime owner named in the contract catalog"
    status: "mixed-coverage"

  - id: "behavior-benchmark-specs"
    kind: "benchmark-input"
    path_pattern: "benchmarks/specs/*.behavior.json"
    producer: "manual-fixtures"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/behavior-spec.schema.json"
    authority: "Tracked benchmark fixtures"
    status: "verified-in-ci"

  - id: "design-agent-benchmark-tasks"
    kind: "benchmark-input"
    path_pattern: "benchmarks/tasks/[0-9][0-9]_*.json"
    producer: "benchmarks/tasks/gen_tasks_v0.jl"
    validator: "unknown"
    authority: "Tracked benchmark fixtures"
    status: "schema-coverage-unknown"

  - id: "atlas-build-specs"
    kind: "compute-config"
    path_pattern: "atlas_specs/*.spec.json"
    producer: "manual-versioned-config"
    validator: "unknown"
    authority: "Tracked build specifications interpreted by webapp/src/atlas.jl"
    status: "runtime-parser-exists-dedicated-validation-unknown"

  - id: "migration-parity-goldens"
    kind: "regression-golden"
    path_pattern: "tools/migration_parity/goldens/*.json"
    producer: "tools/migration_parity/capture_goldens.jl"
    validator: "tools/migration_parity/assert_parity.jl"
    authority: "Tracked golden index and payloads"
    status: "regression-fixture"

  - id: "periodic-table-slices-embedded"
    kind: "research-data-snapshot"
    paths:
      - "paper_rop_periodic_table/data/slices.jsonl.gz"
    producer: "paper_rop_periodic_table/extraction/rpt_build.py"
    validator: "manual-audit-at-f9c65a5"
    authority: "Explorer-embedded snapshot only; not manuscript authority"
    status: "conflict-unresolved"
    observed:
      sha256: "38d05fc7a219e3b0ef85c15777311713fd6916da6a9e8b592660e88a9824708f"
      parseable_nonempty_json_lines: 147081
      distinct_non_null_nid: 5234
      nearby_prose_slice_count: 146845
      canonical_publication_slice_count: "unknown"
      relationship_between_metadata_networks_and_distinct_nid: "unknown"

  - id: "periodic-table-aggregates-embedded"
    kind: "research-derived-snapshot"
    paths:
      - "paper_rop_periodic_table/data/periodic_table.json"
      - "paper_rop_periodic_table/data/behavior_records.json"
      - "paper_rop_periodic_table/data/motif_rep_prog.json"
    producer: "mixed-and-partly-unresolved"
    producer_by_path:
      paper_rop_periodic_table/data/periodic_table.json: "paper_rop_periodic_table/extraction/rpt_build.py"
      paper_rop_periodic_table/data/behavior_records.json: "unknown"
      paper_rop_periodic_table/data/motif_rep_prog.json: "unknown"
    validator: "manual hash and metadata audit at f9c65a5"
    authority: "Explorer-embedded snapshot only; standalone paper repository owns manuscript use"
    status: "partial-producer-lineage-lock-missing"
    paper_lineage_note: "The standalone paper locks different aggregate bytes with a separate motif postprocessing chain; do not merge the lineages by filename."
    observed:
      periodic_table_sha256: "fa9fb2f04bde13015ac5573c349c18e3908d8f7e4980805b08be4b6bb4b4e48e"
      behavior_records_sha256: "fba6e362f2ec67f6d162783e72092585babdc7eac671ecb0272cdb9245766b9b"
      motif_rep_prog_sha256: "ae766790d02b12aadd056e1c2844849ed0f399da5f1e46f7c497ebecf62f68e5"
      metadata_n_slices: 147081
      metadata_n_networks: 5240
      canonical_publication_network_count: "unknown"

  - id: "periodic-table-web-script-mirrors"
    kind: "compatibility-copy"
    paths:
      - "webapp/scripts/rop_periodic_table/periodic_table.json"
      - "webapp/scripts/rop_periodic_table/behavior_records.json"
      - "webapp/scripts/rop_periodic_table/motif_rep_prog.json"
    producer: "research-export-copy"
    validator: "manual-byte-comparison-at-f9c65a5"
    authority: "Non-canonical copy"
    status: "byte-identical-to-embedded-aggregates-at-verified-revision"

  - id: "periodic-table-paper-provenance-baseline"
    kind: "external-consumer-snapshot-lock"
    storage: "paper_rop_periodic_table:provenance/explorer-artifact-lock.json"
    producer: "paper provenance capture committed at bbe91d958df29a98b6462cbdf319002e7fdac8e6"
    validator: "python3 provenance/verify.py --mode ci (run in paper_rop_periodic_table)"
    authority: "paper_rop_periodic_table commit bbe91d958df29a98b6462cbdf319002e7fdac8e6"
    status: "consumer-snapshot-locked-producer-lineage-unresolved"
    observed:
      paper_base_revision: "7f462e4fad5008203fb01d048a6b0b58947cb829"
      provenance_revision: "bbe91d958df29a98b6462cbdf319002e7fdac8e6"
      ci_gate: "passes"
      release_gate: "blocked-by-recorded-provenance-gaps"

  - id: "periodic-table-paper-working-observation"
    kind: "external-working-observation"
    storage: "paper_rop_periodic_table:provenance/observations/2026-07-10-working-tree.json"
    producer: "dated comparison of the standalone paper working tree and Explorer candidate"
    validator: "paper_rop_periodic_table:provenance/verify.py"
    authority: "Observation only; exact values are owned by the paper provenance record"
    status: "candidate-not-promoted"

  - id: "runtime-atlas-datasets"
    kind: "optional-runtime-data"
    path_pattern: "datasets/*/manifest.json"
    allow_empty: true
    producer: "multiple-runtime-builders"
    producer_sources:
      - "webapp/scripts/reader"
      - "webapp/scripts"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/latent-atlas-manifest.schema.json"
    authority: "A present, hash-pinned manifest; no tracked instance exists at this revision"
    status: "absent-optional"

  - id: "periodic-search-runs"
    kind: "generated-run-output"
    paths:
      - "results/periodic_table/runs/.gitkeep"
      - "results/periodic_table/checkpoints/.gitkeep"
    producer: "scripts/periodic_table/run_periodic_search.py"
    validator: "scripts/periodic_table/verify_results.py"
    authority: "A run manifest and result records, not the placeholder directories"
    status: "no-tracked-run"

  - id: "api-result-envelopes"
    kind: "runtime-output"
    storage: "runtime-only"
    producer: "webapp/src/result_artifact.jl"
    validator: "webapp/test/runtests.jl"
    schema: "schemas/result-artifact.schema.json"
    authority: "The returned/stored envelope and its input hashes"
    status: "contract-tested"
