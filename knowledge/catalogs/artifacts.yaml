schema_version: "bcx-artifact-catalog/v1.0.0"
baseline_evidence_revision: "f9c65a5"
current_verified_revision: "b91cf41"
verification_command: "python3 scripts/verify_repository.py --check"
path_base: "repository-root"
path_policy: "posix-relative"
unknown_token: "unknown"
artifacts:
  - id: "container-image-release"
    kind: "release-artifact"
    storage: "external container registry or local Docker daemon"
    definition_paths:
      - "deploy/Dockerfile"
      - "deploy/build_image.sh"
      - "deploy/image_reference.sh"
      - ".github/workflows/docker.yml"
    producer: "deploy/build_image.sh"
    validator: ".github/workflows/docker.yml"
    authority: "An immutable digest or accepted SemVer-plus-commit tag together with OCI revision and version labels"
    status: "workflow-configured-for-build-and-single-container-runtime-smoke-not-published"

  - id: "macos-backend-bundle"
    kind: "release-artifact"
    storage: "untracked local dist output"
    definition_paths:
      - "scripts/build_macos_dmg.sh"
      - "packaging/build_backend_app.jl"
      - "packaging/design-runtime-files.txt"
      - "frontend-swift/BiocircuitsExplorerMac.xcodeproj/project.pbxproj"
    producer: "scripts/build_macos_dmg.sh"
    validator: "packaging/test_design_runtime.jl plus tests/test_macos_release_metadata.py and tests/version_resource_contract.jl"
    authority: "The built app bundle and DMG carrying the synchronized VERSION resource and staged Design Agent runtime files"
    status: "resource-contract-tested-signing-and-notarization-unverified"

  - id: "hpc-environment-locks"
    kind: "dependency-lock"
    paths:
      - "webapp_hpc/Project.toml"
      - "webapp_hpc/Manifest-v1.10.toml"
      - "webapp_hpc/Manifest.toml"
    producer: "Julia Pkg resolution under the declared major-minor runtime"
    validator: ".github/workflows/ci.yml test-hpc-environment matrix"
    authority: "Julia selects Manifest-v1.10.toml before 1.11 and Manifest.toml for the current 1.12 environment"
    status: "workflow-configured-and-locally-loaded-on-julia-1.10.11-and-1.12.6"

  - id: "generated-contract-reference"
    kind: "generated-reference"
    paths:
      - "knowledge/generated/reference.md"
    producer: "scripts/verify_repository.py --write"
    validator: "scripts/verify_repository.py --check"
    authority: "Executable API metadata, JSON Schemas, contract catalogs, version files, and CI configuration"
    status: "deterministic-drift-gated"

  - id: "ir-json-schemas"
    kind: "generated-contract"
    paths:
      - "schemas/network-ir.schema.json"
      - "schemas/design-spec.schema.json"
    producer: "webapp/scripts/gen_schemas.jl"
    validator: "scripts/verify_repository.py --check"
    authority: "Runtime structs and parser in webapp/src/ir.jl"
    status: "verified-drift-gated"

  - id: "hand-authored-json-schemas"
    kind: "contract"
    paths:
      - "schemas/behavior-spec.schema.json"
      - "schemas/design-agent-trace.schema.json"
      - "schemas/designability-screen.schema.json"
      - "schemas/designability-spec.schema.json"
      - "schemas/latent-atlas-manifest.schema.json"
      - "schemas/job-result-manifest.schema.json"
      - "schemas/reader-query.schema.json"
      - "schemas/reader-result.schema.json"
      - "schemas/ro-field.schema.json"
      - "schemas/ro-field-request.schema.json"
      - "schemas/ro-field-differential-analysis.schema.json"
      - "schemas/ro-field-differential-request.schema.json"
      - "schemas/rop-shape-optimization.schema.json"
      - "schemas/rop-shape-optimize-request.schema.json"
      - "schemas/result-artifact.schema.json"
      - "schemas/target-spec.schema.json"
      - "schemas/workspace.schema.json"
      - "schemas/release-candidate-evidence.schema.json"
    producer: "manual-with-runtime-owner"
    validator: "scripts/verify_repository.py --check"
    authority: "Each schema plus the runtime owner named in the contract catalog"
    status: "mixed-coverage-including-bounded-ro-field-v1-runtime-and-semantic-fixtures"

  - id: "ro-field-contract-examples"
    kind: "contract-fixture"
    paths:
      - "tests/fixtures/ro_field/sampled-grid.json"
      - "tests/fixtures/ro_field/exact-cell-complex.json"
      - "tests/fixtures/ro_field/directional-path.json"
    producer: "manual-analytic-contract-fixtures"
    validator: "tests/test_ro_field_schema.py"
    schema: "schemas/ro-field.schema.json"
    authority: "Small structural and semantic examples for the RO Field v1 interchange contract, including canonical 2D vertices/facets, singular strata, and gap-preserving evidence"
    status: "schema-fixtures-plus-bounded-engine-api-sqlite-render-and-explicit-demo-atlas-contracts"

  - id: "ro-field-request-contract-examples"
    kind: "contract-fixture"
    paths:
      - "tests/fixtures/ro_field_request/sampled-inline-network.json"
      - "tests/fixtures/ro_field_request/exact-network-hash.json"
      - "tests/fixtures/ro_field_request/sampled-session-reference.json"
    producer: "manual-bounded-request-fixtures"
    validator: "tests/test_ro_field_request_schema.py"
    schema: "schemas/ro-field-request.schema.json"
    authority: "Strict examples for each exclusive model source, both request representations, and all portable storage modes"
    status: "schema-fixtures-plus-inline-runtime-producer-non-inline-modes-explicitly-unsupported"

  - id: "ro-field-differential-analysis-example"
    kind: "contract-fixture"
    paths:
      - "tests/fixtures/ro_field_differential_analysis/one-dimensional.json"
    producer: "bounded-runtime-differential-analysis"
    validator: "tests/test_ro_field_differential_schema.py"
    schema: "schemas/ro-field-differential-analysis.schema.json"
    authority: "One-dimensional analytic differential fixture with canonical source and artifact hash checks; multidimensional semantics remain covered by Julia runtime contracts"
    status: "schema-fixture-plus-runtime-semantic-contract"

  - id: "ro-field-sparse-v2-nested-cas-family"
    kind: "runtime-artifact-family"
    storage: "local job store under ro-field-sparse-v2/{plans,batches,chunks,states,checkpoints,results,manifests}"
    definition_paths:
      - "webapp/src/ro_field_sparse_jobs.jl"
      - "Bnc_julia/src/rop/ro_sparse_sampler.jl"
    producer: "webapp/src/ro_field_sparse_jobs.jl local_async compute_ro_field worker"
    validator: "webapp/test/ro_field_sparse_job_contract.jl plus validate_ro_field_sparse_job_result!"
    authority: "Scientific acceptance requires canonical replay of the bound plan, batch, ordered point-result chunks, prior and next sampler states, checkpoint, terminal result, and manifest; SHA-addressed names establish byte integrity, addressing, and lineage only, so no individual self-hash is a scientific certificate, continuum bound, or proof of external execution"
    status: "local-runtime-contract-tested-with-runtime-lock-solver-caps-strict-regime-and-replay-bound-no-live-object-store-or-full-campaign"

  - id: "ro-regular-extension-integrability-3d-runtime-evidence"
    kind: "runtime-evidence"
    version: "bne-ro-regular-extension-integrability-3d/v1.0.0"
    storage: "runtime-only"
    definition_paths:
      - "Bnc_julia/src/rop/ro_stratified_field_3d.jl"
      - "Bnc_julia/test/ro_stratified_field_3d_contract.jl"
    producer: "certify_ro_regular_extension_integrability_3d"
    validator: "validate_ro_regular_extension_integrability_certificate_3d plus Bnc_julia/test/ro_stratified_field_3d_contract.jl"
    authority: "Exact authority is limited to the explicit convex-affine D3 contract: admitted Float64 bits interpreted as dyadic rationals, a complete contractible box, regular-cell extensions, and validation plus replay against the bound source complex; canonical or self hashes establish content identity only and do not certify arbitrary-real inputs, higher dimensions, holed-domain cohomology, singular branches, or chemistry extraction"
    status: "focused-runtime-contract-tested"

  - id: "ro-model-backed-finite-protocol-trajectory-runtime-evidence"
    kind: "runtime-evidence"
    version: "bne-ro-model-backed-trajectory-evidence/v2.0.0"
    storage: "runtime-only"
    definition_paths:
      - "Bnc_julia/src/rop/ro_dynamic_hysteresis.jl"
      - "Bnc_julia/src/rop/ro_dynamic_trajectory.jl"
      - "Bnc_julia/test/ro_dynamic_trajectory_contract.jl"
    producer: "simulate_ro_model_backed_trajectory"
    validator: "validate_ro_model_backed_trajectory_evidence plus Bnc_julia/test/ro_dynamic_trajectory_contract.jl"
    authority: "Authority is limited to a finite deterministic polynomial-protocol numerical trajectory bound to its vector field, explicit model-time and structured control/time rate-unit identities, protocol, solver policy, and lineage identities; hashes establish provenance and content identity only, not validated error enclosures, branch-switch or dynamic-hysteresis certificates, global reachability, basin completeness, or experimental causality"
    status: "focused-runtime-contract-tested-no-experimental-or-global-dynamics-authority"

  - id: "release-candidate-evidence-template"
    kind: "verification-template"
    paths:
      - "operations/evidence/release-candidate.template.json"
    producer: "authorized release operator"
    validator: "tests/test_release_candidate_evidence.py"
    authority: "A completed, redacted record validated against schemas/release-candidate-evidence.schema.json"
    status: "template-only-no-external-lane-executed"

  - id: "designability-screen-v0.3-responses"
    kind: "runtime-output"
    storage: "runtime-only"
    definition_paths:
      - "webapp/src/designability.jl"
      - "webapp/public/js/design-screen-render.js"
    producer: "webapp/src/designability.jl"
    validator: "webapp/test/design_screen_contract.jl plus webapp/test/design-target-render.test.mjs"
    schema: "schemas/designability-screen.schema.json"
    authority: "The v0.3 response, including eligible_count, evaluated_count, and truncated, together with its evidence-graded candidate cards"
    status: "v0.3-backend-and-rendering-contract-tested"

  - id: "rop-shape-cat-benchmark-result"
    kind: "benchmark-result"
    storage: "tracked repository artifact"
    paths:
      - "benchmarks/rop_shape_control/cat_fixed_topology.json"
      - "benchmarks/rop_shape_control/cat_fixed_topology_results.json"
      - "benchmarks/rop_shape_control/run_benchmark.jl"
    producer: "benchmarks/rop_shape_control/run_benchmark.jl"
    validator: "webapp/test/rop_shape_cat_benchmark.jl"
    reproduce_command: "julia --project=webapp benchmarks/rop_shape_control/run_benchmark.jl"
    authority: "The frozen JSON result is exhaustive only over the declared fixed-topology eligible path/cell population. Its canonical result_hash excludes the subsequently attached timestamped artifact envelope; the file hash locks the exact tracked bytes."
    status: "tracked-read-only-contract-tested"
    observed:
      fixture_file_sha256: "a37a3f8562c7d82a4d08d6032c6b22a875c4e3e8f460ca1fba2232ee820dab5c"
      producer_file_sha256: "7f920ab23f4a8981b2e2de1710e6109471650670598a8c769795ead866253dca"
      result_file_sha256: "f91a319c1e8a9200503560daa02c40c07cf05c8d11e38f844e19b4bfee558d1b"
      result_hash: "6eda30d093ea44cf841e1eefa87f51659b39e025719e70e109fdca6ddebd177f"
      schema_version: "bne-rop-shape-benchmark-result/v1.0.0"
      evidence_scope: "fixed-topology finite-window SISO ROP benchmark; not a global chemistry claim"
      edit_count: 4
      eligible_path_count_per_edit: 18
      evaluated_path_count_per_edit: 18
      eligible_cell_count_per_edit: 24
      evaluated_cell_count_per_edit: 24
      any_direct_search_truncated: false
      all_direct_searches_exhaustive_over_declared_population: true
      direct_geometric_success_count: 4
      direct_replay_pass_count: 3
      non_grid_optimum_count: 4

  - id: "behavior-benchmark-specs"
    kind: "benchmark-input"
    path_pattern: "benchmarks/specs/*.behavior.json"
    producer: "manual-fixtures"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/behavior-spec.schema.json"
    authority: "Tracked benchmark fixtures"
    status: "verified-in-ci"

  - id: "design-agent-benchmark-tasks"
    kind: "benchmark-input"
    path_pattern: "benchmarks/tasks/[0-9][0-9]_*.json"
    producer: "benchmarks/tasks/gen_tasks_v0.jl"
    validator: "unknown"
    authority: "Tracked benchmark fixtures"
    status: "schema-coverage-unknown"

  - id: "atlas-build-specs"
    kind: "compute-config"
    path_pattern: "atlas_specs/*.spec.json"
    producer: "manual-versioned-config"
    validator: "unknown"
    authority: "Tracked build specifications interpreted by webapp/src/atlas.jl"
    status: "runtime-parser-exists-dedicated-validation-unknown"

  - id: "migration-parity-goldens"
    kind: "regression-golden"
    path_pattern: "tools/migration_parity/goldens/*.json"
    producer: "tools/migration_parity/capture_goldens.jl"
    validator: "tools/migration_parity/assert_parity.jl"
    authority: "Tracked golden index and payloads"
    status: "regression-fixture"

  - id: "runtime-atlas-datasets"
    kind: "optional-runtime-data"
    path_pattern: "datasets/*/manifest.json"
    allow_empty: true
    producer: "multiple-runtime-builders"
    producer_sources:
      - "webapp/scripts/reader"
      - "webapp/scripts"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/latent-atlas-manifest.schema.json"
    authority: "A present, hash-pinned manifest; no tracked instance exists at this revision"
    status: "absent-optional"

  - id: "periodic-search-runs"
    kind: "generated-run-output"
    paths:
      - "results/periodic_table/runs/.gitkeep"
      - "results/periodic_table/checkpoints/.gitkeep"
    producer: "scripts/periodic_table/run_periodic_search.py"
    validator: "scripts/periodic_table/verify_results.py"
    authority: "A run manifest and result records, not the placeholder directories"
    status: "no-tracked-run"

  - id: "api-result-envelopes"
    kind: "runtime-output"
    storage: "runtime-only"
    producer: "webapp/src/result_artifact.jl"
    validator: "webapp/test/runtests.jl"
    schema: "schemas/result-artifact.schema.json"
    authority: "The returned/stored envelope and its input hashes"
    status: "contract-tested"

  - id: "asynchronous-job-result-manifests"
    kind: "runtime-commit-marker"
    storage: "job store or object storage beside result.json"
    producer: "webapp/src/jobs.jl worker result publisher"
    validator: "webapp/src/jobs.jl broker validator plus webapp/test/jobs_artifact_validity_contract.jl"
    schema: "schemas/job-result-manifest.schema.json"
    authority: "A manifest published after result.json whose job, kind, config hash, byte length, media type, payload count, and SHA-256 match the canonical job record and result object metadata"
    status: "working-tree-contract-tested-live-object-storage-unverified"
