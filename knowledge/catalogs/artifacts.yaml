schema_version: "bcx-artifact-catalog/v1.0.0"
baseline_evidence_revision: "f9c65a5"
current_verified_revision: "1177a3d"
verification_command: "python3 scripts/verify_repository.py --check"
path_base: "repository-root"
path_policy: "posix-relative"
unknown_token: "unknown"
artifacts:
  - id: "container-image-release"
    kind: "release-artifact"
    storage: "external container registry or local Docker daemon"
    definition_paths:
      - "deploy/Dockerfile"
      - "deploy/build_image.sh"
      - "deploy/image_reference.sh"
      - ".github/workflows/docker.yml"
    producer: "deploy/build_image.sh"
    validator: ".github/workflows/docker.yml"
    authority: "An immutable digest or accepted SemVer-plus-commit tag together with OCI revision and version labels"
    status: "workflow-configured-for-build-and-single-container-runtime-smoke-not-published"

  - id: "macos-backend-bundle"
    kind: "release-artifact"
    storage: "untracked local dist output"
    definition_paths:
      - "scripts/build_macos_dmg.sh"
      - "packaging/build_backend_app.jl"
      - "packaging/design-runtime-files.txt"
      - "frontend-swift/BiocircuitsExplorerMac.xcodeproj/project.pbxproj"
    producer: "scripts/build_macos_dmg.sh"
    validator: "packaging/test_design_runtime.jl plus tests/test_macos_release_metadata.py and tests/version_resource_contract.jl"
    authority: "The built app bundle and DMG carrying the synchronized VERSION resource and staged Design Agent runtime files"
    status: "resource-contract-tested-signing-and-notarization-unverified"

  - id: "hpc-environment-locks"
    kind: "dependency-lock"
    paths:
      - "webapp_hpc/Project.toml"
      - "webapp_hpc/Manifest-v1.10.toml"
      - "webapp_hpc/Manifest.toml"
    producer: "Julia Pkg resolution under the declared major-minor runtime"
    validator: ".github/workflows/ci.yml test-hpc-environment matrix"
    authority: "Julia selects Manifest-v1.10.toml before 1.11 and Manifest.toml for the current 1.12 environment"
    status: "workflow-configured-and-locally-loaded-on-julia-1.10.11-and-1.12.6"

  - id: "generated-contract-reference"
    kind: "generated-reference"
    paths:
      - "knowledge/generated/reference.md"
    producer: "scripts/verify_repository.py --write"
    validator: "scripts/verify_repository.py --check"
    authority: "Executable API metadata, JSON Schemas, contract catalogs, version files, and CI configuration"
    status: "deterministic-drift-gated"

  - id: "ir-json-schemas"
    kind: "generated-contract"
    paths:
      - "schemas/network-ir.schema.json"
      - "schemas/design-spec.schema.json"
    producer: "webapp/scripts/gen_schemas.jl"
    validator: "scripts/verify_repository.py --check"
    authority: "Runtime structs and parser in webapp/src/ir.jl"
    status: "verified-drift-gated"

  - id: "hand-authored-json-schemas"
    kind: "contract"
    paths:
      - "schemas/behavior-spec.schema.json"
      - "schemas/design-agent-trace.schema.json"
      - "schemas/designability-screen.schema.json"
      - "schemas/designability-spec.schema.json"
      - "schemas/latent-atlas-manifest.schema.json"
      - "schemas/reader-query.schema.json"
      - "schemas/reader-result.schema.json"
      - "schemas/result-artifact.schema.json"
      - "schemas/target-spec.schema.json"
    producer: "manual-with-runtime-owner"
    validator: "scripts/verify_repository.py --check"
    authority: "Each schema plus the runtime owner named in the contract catalog"
    status: "mixed-coverage-design-screen-v0.3-directly-tested"

  - id: "designability-screen-v0.3-responses"
    kind: "runtime-output"
    storage: "runtime-only"
    definition_paths:
      - "webapp/src/designability.jl"
      - "webapp/public/js/design-screen-render.js"
    producer: "webapp/src/designability.jl"
    validator: "webapp/test/design_screen_contract.jl plus webapp/test/design-target-render.test.mjs"
    schema: "schemas/designability-screen.schema.json"
    authority: "The v0.3 response, including eligible_count, evaluated_count, and truncated, together with its evidence-graded candidate cards"
    status: "v0.3-backend-and-rendering-contract-tested"

  - id: "behavior-benchmark-specs"
    kind: "benchmark-input"
    path_pattern: "benchmarks/specs/*.behavior.json"
    producer: "manual-fixtures"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/behavior-spec.schema.json"
    authority: "Tracked benchmark fixtures"
    status: "verified-in-ci"

  - id: "design-agent-benchmark-tasks"
    kind: "benchmark-input"
    path_pattern: "benchmarks/tasks/[0-9][0-9]_*.json"
    producer: "benchmarks/tasks/gen_tasks_v0.jl"
    validator: "unknown"
    authority: "Tracked benchmark fixtures"
    status: "schema-coverage-unknown"

  - id: "atlas-build-specs"
    kind: "compute-config"
    path_pattern: "atlas_specs/*.spec.json"
    producer: "manual-versioned-config"
    validator: "unknown"
    authority: "Tracked build specifications interpreted by webapp/src/atlas.jl"
    status: "runtime-parser-exists-dedicated-validation-unknown"

  - id: "migration-parity-goldens"
    kind: "regression-golden"
    path_pattern: "tools/migration_parity/goldens/*.json"
    producer: "tools/migration_parity/capture_goldens.jl"
    validator: "tools/migration_parity/assert_parity.jl"
    authority: "Tracked golden index and payloads"
    status: "regression-fixture"

  - id: "runtime-atlas-datasets"
    kind: "optional-runtime-data"
    path_pattern: "datasets/*/manifest.json"
    allow_empty: true
    producer: "multiple-runtime-builders"
    producer_sources:
      - "webapp/scripts/reader"
      - "webapp/scripts"
    validator: "webapp/scripts/validate_artifacts.py"
    schema: "schemas/latent-atlas-manifest.schema.json"
    authority: "A present, hash-pinned manifest; no tracked instance exists at this revision"
    status: "absent-optional"

  - id: "periodic-search-runs"
    kind: "generated-run-output"
    paths:
      - "results/periodic_table/runs/.gitkeep"
      - "results/periodic_table/checkpoints/.gitkeep"
    producer: "scripts/periodic_table/run_periodic_search.py"
    validator: "scripts/periodic_table/verify_results.py"
    authority: "A run manifest and result records, not the placeholder directories"
    status: "no-tracked-run"

  - id: "api-result-envelopes"
    kind: "runtime-output"
    storage: "runtime-only"
    producer: "webapp/src/result_artifact.jl"
    validator: "webapp/test/runtests.jl"
    schema: "schemas/result-artifact.schema.json"
    authority: "The returned/stored envelope and its input hashes"
    status: "contract-tested"
