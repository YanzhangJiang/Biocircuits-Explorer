schema_version: "bcx-knowledge-manifest/v1.0.0"
baseline_evidence_revision: "f9c65a5"
current_verified_revision: "1177a3d"
verification_command: "python3 scripts/verify_repository.py --check"
path_base: "repository-root"
path_policy: "posix-relative"
unknown_token: "unknown"

entrypoints:
  - id: "project-summary"
    path: "PROJECT_SUMMARY.md"
    layer: "L0"
    purpose: "Smallest cold-start project map"
  - id: "root-readme"
    path: "README.md"
    layer: "L1"
    purpose: "Human product orientation and first-run routes"
  - id: "agent-guide"
    path: "AGENTS.md"
    layer: "L1"
    purpose: "Repository-safe agent re-entry and verification rules"
  - id: "knowledge-index"
    path: "knowledge/README.md"
    layer: "L1"
    purpose: "Authority model and navigation"
  - id: "current-status"
    path: "knowledge/status/current.md"
    layer: "L1"
    purpose: "Verified snapshot, unknowns, and current gate"

authority_order:
  - "observed-runtime-and-immutable-artifact-bytes"
  - "executable-source-and-tests-at-declared-revision"
  - "versioned-schema-and-passing-generated-drift-check"
  - "knowledge-contract-catalog-and-accepted-decision"
  - "architecture-and-module-card"
  - "entrypoint-summary"
  - "historical-or-copied-narrative"

catalogs:
  modules: "knowledge/catalogs/modules.yaml"
  contracts: "knowledge/catalogs/contracts.yaml"
  artifacts: "knowledge/catalogs/artifacts.yaml"

documents:
  - id: "generated-contract-reference"
    path: "knowledge/generated/reference.md"
    kind: "generated-reference"
    owner: "cross-module"
    status: "generated-do-not-edit"

  - id: "glossary"
    path: "knowledge/glossary.md"
    kind: "reference"
    owner: "knowledge-core"
    status: "active"

  - id: "architecture-overview"
    path: "knowledge/architecture/overview.md"
    kind: "architecture"
    owner: "cross-module"
    status: "active"
  - id: "architecture-runtime"
    path: "knowledge/architecture/runtime.md"
    kind: "architecture"
    owner: "backend-runtime"
    status: "active"
  - id: "architecture-data-provenance"
    path: "knowledge/architecture/data-provenance.md"
    kind: "architecture"
    owner: "cross-module"
    status: "active"

  - id: "module-engine-rop"
    path: "knowledge/modules/engine-rop.md"
    kind: "module-card"
    owner: "engine-rop"
    status: "active"
  - id: "module-backend-runtime"
    path: "knowledge/modules/backend-runtime.md"
    kind: "module-card"
    owner: "backend-runtime"
    status: "active"
  - id: "module-atlas"
    path: "knowledge/modules/atlas.md"
    kind: "module-card"
    owner: "atlas"
    status: "active"
  - id: "module-designability"
    path: "knowledge/modules/designability.md"
    kind: "module-card"
    owner: "designability"
    status: "active"
  - id: "module-design-agent"
    path: "knowledge/modules/design-agent.md"
    kind: "module-card"
    owner: "design-agent"
    status: "active"
  - id: "module-web-workspace"
    path: "knowledge/modules/web-workspace.md"
    kind: "module-card"
    owner: "web-workspace"
    status: "active"
  - id: "module-macos-host"
    path: "knowledge/modules/macos-host.md"
    kind: "module-card"
    owner: "macos-host"
    status: "active"
  - id: "module-deployment"
    path: "knowledge/modules/deployment.md"
    kind: "module-card"
    owner: "deployment"
    status: "active"
  - id: "module-batch-hpc"
    path: "knowledge/modules/batch-hpc.md"
    kind: "module-card"
    owner: "batch-hpc"
    status: "active"
  - id: "module-periodic-table-research"
    path: "knowledge/modules/periodic-table-research.md"
    kind: "module-card"
    owner: "periodic-table-research"
    status: "active"

  - id: "contract-api"
    path: "knowledge/contracts/api.md"
    kind: "contract"
    owner: "backend-runtime"
    status: "active"
  - id: "contract-schemas"
    path: "knowledge/contracts/schemas.md"
    kind: "contract"
    owner: "cross-module"
    status: "active"
  - id: "contract-scientific-evidence"
    path: "knowledge/contracts/scientific-evidence.md"
    kind: "contract"
    owner: "cross-module"
    status: "active"

  - id: "research-repository-roles"
    path: "knowledge/research/repositories.md"
    kind: "research-governance"
    owner: "cross-repository"
    status: "active"
  - id: "decision-policy"
    path: "knowledge/decisions/README.md"
    kind: "process"
    owner: "knowledge-core"
    status: "active"
  - id: "decision-template"
    path: "knowledge/decisions/template.md"
    kind: "template"
    owner: "knowledge-core"
    status: "active"
  - id: "0001-shared-runtime-concurrency"
    path: "knowledge/decisions/0001-shared-runtime-concurrency.md"
    kind: "architecture-decision"
    owner: "backend-runtime"
    status: "accepted"
  - id: "context-pack-policy"
    path: "knowledge/context-packs/README.md"
    kind: "process"
    owner: "knowledge-core"
    status: "active"
  - id: "context-pack-template"
    path: "knowledge/context-packs/template.md"
    kind: "template"
    owner: "knowledge-core"
    status: "active"
  - id: "context-pack-paper-evidence-transfer"
    path: "knowledge/context-packs/paper-evidence-transfer.md"
    kind: "context-pack"
    owner: "cross-repository"
    status: "active"

accepted_decisions:
  - "0001-shared-runtime-concurrency"
active_context_packs:
  - "context-pack-paper-evidence-transfer"

known_gaps:
  - id: "workstation-campaign-scripts"
    path_pattern: "workstation/**"
    classification: "site-specific-historical"
    current_owner: "unknown"
    reason: "These campaign scripts retain assumptions from one workstation environment and are not part of the current batch-hpc owner, entrypoint, or provided-contract surface."
    verification: "No portable workstation campaign or result-merge run is CI-verified."

non_authoritative_by_default:
  - path_pattern: "doc/**"
    reason: "Mixed historical prose, generated outputs, and host-specific material"
  - path_pattern: "docs/**"
    reason: "Legacy narrative not continuously checked against source"
  - path_pattern: "wiki/**"
    reason: "Legacy narrative not continuously checked against source"
  - path_pattern: "paper_rop_periodic_table/**"
    reason: "Embedded research snapshot, not standalone manuscript authority"
  - path_pattern: "webapp/scripts/_archive/**"
    reason: "Archived campaign scripts"
  - path_pattern: "workstation/**"
    reason: "Site-specific historical campaign scripts outside the current batch-hpc contract"

public_safety:
  allow_private_repository_urls: false
  allow_private_checkout_paths: false
  allow_workstation_paths: false
  allow_credentials_or_raw_private_feedback: false
